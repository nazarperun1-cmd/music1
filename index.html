<body>

<div class="container">
    <!-- Форма загрузки прямо на сайте -->
    <div class="card">
        <h2>Загрузить новый трек</h2>
        <div class="upload-zone">
            <input type="text" id="trackTitle" placeholder="Название трека">
            <input type="text" id="trackArtist" placeholder="Исполнитель">
            <input type="file" id="audioFile" accept="audio/*">
            <button onclick="saveTrack()">Опубликовать на сайте</button>
        </div>
    </div>

    <!-- Список загруженных треков -->
    <div class="card">
        <h2>Плейлист</h2>
        <div id="playlist"></div>
    </div>
</div>

<script>
    // Инициализация базы данных в браузере
    let db;
    const request = indexedDB.open("MusicSiteDB", 1);

    request.onupgradeneeded = (e) => {
        db = e.target.result;
        db.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
    };

    request.onsuccess = (e) => {
        db = e.target.result;
        loadPlaylist();
    };

    function saveTrack() {
        const title = document.getElementById("trackTitle").value || "Без названия";
        const artist = document.getElementById("trackArtist").value || "Неизвестен";
        const fileInput = document.getElementById("audioFile");

        if (!fileInput.files[0]) {
            alert("Пожалуйста, выберите MP3 файл!");
            return;
        }

        const file = fileInput.files[0];
        const transaction = db.transaction(["tracks"], "readwrite");
        const store = transaction.objectStore("tracks");

        store.add({ title, artist, file });

        transaction.oncomplete = () => {
            document.getElementById("trackTitle").value = "";
            document.getElementById("trackArtist").value = "";
            fileInput.value = "";
            loadPlaylist();
        };
    }

        const playlist = document.getElementById("playlist");
        playlist.innerHTML = "";

                item.innerHTML =
