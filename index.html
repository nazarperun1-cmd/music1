<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazar — Player</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin: 0 0 5px 0; font-size: 22px; color: #f0f6fc; }
        p { margin: 0 0 25px 0; font-size: 14px; color: #8b949e; }
        audio { width: 100%; outline: none; border-radius: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Мой Трек</h2>
    <p>Nazar</p>
    <audio controls src="https://www.dropbox.com/scl/fi/r88s3juenr6pmyouh1qju/track1.mp3.mp3?rlkey=e2bn431gz94nl5flxipwhumd3&st=ddr5kf32&raw=1"></audio>
</div>

</body>
</html>
