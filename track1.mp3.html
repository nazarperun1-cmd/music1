<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Музыка</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .player-card {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 320px;
            text-align: center;
        }
        .cover {
            font-size: 60px;
            margin-bottom: 16px;
        }
        h2 { margin: 8px 0 4px; font-size: 20px; }
        p { color: #94a3b8; margin: 0 0 16px; font-size: 14px; }
        audio { width: 100%; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="player-card">
        <div class="cover">🎵</div>
        <h2 id="title">Мой Трек</h2>
        <p id="artist">Мой Псевдоним</p>

        <!-- Аудиоплеер -->
        <audio controls>
            <source src="track1.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудиоплеер.
        </audio>
    </div>

</body>
</html>
